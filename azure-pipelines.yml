# EJERCICIO 1: Estructura mínima (trigger y pr)
trigger:
  - master
  - develop

pr:
  - master
  - develop

# EJERCICIO 3: Definición de parámetros para ejecución manual
parameters:
  - name: RUN_CD
    displayName: 'Forzar Despliegue Continuo (CD)'
    type: boolean
    default: false

# EJERCICIO 2 y 3: Variable Groups y Variables Globales
variables:
  # Referencia teórica a "Pipelines -> Library -> Variable groups" (Ejercicio 2)
  - group: devops-training-python-local
  # Variables globales (Ejercicio 3)
  - name: IMAGE_REPO
    value: 'devops-training-python-app'
  - name: COMPOSE_PROJECT_NAME
    value: 'python-app-$(Build.SourceBranchName)'

# EJERCICIO 1: Definición de Stages y Job de información
stages:
  - stage: CI
    displayName: 'Continuous Integration'
    jobs:
      - job: InfoJob
        displayName: 'Validación de Entorno'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "=== Ejercicios 1, 2 y 3: Información del Pipeline ==="
              echo "Rama actual: $(Build.SourceBranchName)"
              echo "Commit SHA: $(Build.SourceVersion)"
              echo "Parámetro RUN_CD: ${{ parameters.RUN_CD }}"
              echo "Variable Global IMAGE_REPO: $(IMAGE_REPO)"
            displayName: 'Imprimir contexto de ejecución'
      
      # EJERCICIO 4: Ejecutar Lint/Test dentro de imagen CI
      - job: CITests
        displayName: 'Validaciones de Calidad (Lint & Test)'
        dependsOn: InfoJob
        pool:
          vmImage: 'ubuntu-latest' # Se simula un agente público con Docker instalado
        steps:
          - script: |
              echo "=== Ejercicio 4: Construyendo imagen CI ==="
              docker build -t python-ci-tools:$(Build.SourceVersion) -f devops/ci.Dockerfile .
            displayName: 'Build Imagen CI Tools'
          
          - script: |
              echo "=== Ejecutando Lint dentro del contenedor ==="
              docker run --rm -v $(System.DefaultWorkingDirectory):/app -w /app python-ci-tools:$(Build.SourceVersion) make lint
            displayName: 'Run Make Lint'

          - script: |
              echo "=== Ejecutando Test dentro del contenedor ==="
              docker run --rm -v $(System.DefaultWorkingDirectory):/app -w /app python-ci-tools:$(Build.SourceVersion) make test
            displayName: 'Run Make Test'
      
      # EJERCICIO 5: Build de imagen Docker de la aplicación y publicación opcional
      - job: CIBuild
        displayName: 'Build Imagen Producción y Push Imagen'
        dependsOn: CITests
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              echo "=== Ejercicio 5: Construyendo imagen Docker final ==="
              docker build -t $(IMAGE_REPO):$(Build.SourceVersion) -f devops/Dockerfile .
              
              echo "=== Publicación Opcional: Push a Registry Local ==="
              # Se simula la subida al local-registry definido en la estrategia local
              docker tag $(IMAGE_REPO):$(Build.SourceVersion) local-registry:5000/$(IMAGE_REPO):$(Build.SourceVersion)
              docker push local-registry:5000/$(IMAGE_REPO):$(Build.SourceVersion) || true
            displayName: 'Docker Build (App) & Push'

  # EJERCICIOS 6 y 7: Fase de Despliegue Continuo (CD)
  - stage: CD
    displayName: 'Continuous Deployment'
    # Ejercicio 6: Condicionado por rama (develop/master) o parámetro (RUN_CD)
    condition: |
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/master'),
        eq(variables['Build.SourceBranch'], 'refs/heads/develop'),
        eq(parameters.RUN_CD, true)
      )
    jobs:
      - job: Deploy
        displayName: 'Despliegue y Validación'
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          # Ejercicio 6: Resolver DEPLOY_ENV dinámicamente según la rama
          ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
            DEPLOY_ENV: 'PRO'
          ${{ elseif eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
            DEPLOY_ENV: 'DEV'
          ${{ else }}:
            DEPLOY_ENV: 'MANUAL'
        steps:
          - script: |
              echo "=== Ejercicio 6: Entorno resuelto -> $(DEPLOY_ENV) ==="
              echo "=== Ejercicio 7: Desplegando con Docker Compose ==="
              docker compose -p python-app-$(DEPLOY_ENV) up -d
              
              echo "=== Mostrando logs del servicio principal ==="
              sleep 5
              docker compose -p python-app-$(DEPLOY_ENV) logs
            displayName: 'Docker Compose Up & Logs'

          # Ejercicio 7: Cleanup garantizado
          - script: |
              echo "=== Ejercicio 7: Ejecutando Cleanup (siempre) ==="
              docker compose -p python-app-$(DEPLOY_ENV) down --volumes || true
              docker rmi $(IMAGE_REPO):$(Build.SourceVersion) || true
              docker rmi local-registry:5000/$(IMAGE_REPO):$(Build.SourceVersion) || true
            displayName: 'Limpieza de recursos (Cleanup)'
            condition: always() # Esto garantiza que se ejecute siempre, aunque falle el up