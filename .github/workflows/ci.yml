name: Python CI/CD Pipeline

# EJERCICIO 1: Triggers (Cuándo se ejecuta)
on:
  push:
    branches:
      - '**' # Se ejecuta al hacer push en cualquier rama
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch: # Ejecución manual (como el "Build with parameters")
    inputs:
      RUN_CD:
        description: 'Ejecutar CD'
        required: true
        type: boolean
        default: false
      # EJERCICIO 4: Nuevo input de tipo lista (choice)
      DEPLOY_ENV:
        description: 'Entorno de despliegue'
        required: true
        type: choice
        options:
          - DEV
          - PRO
        default: DEV

# EJERCICIO 3: Variables de entorno a nivel global del workflow
env:
  IMAGE_NAME: "python-app:latest" # Cambiado a latest para que el compose de luego lo encuentre
  APP_URL: "http://localhost:5001"
  NIVEL_VAR: "Global del workflow"
  CI_IMAGE_NAME: "python-ci-tools:${{ github.sha }}" # Nueva variable para el Ejercicio 6
  # OPCIONAL A: Ruta del registry de GitHub (GHCR)
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/python-app:latest

jobs:
  # EJERCICIO 2: Estructura base y primer Job
  ci:
    runs-on: ubuntu-latest # Se utiliza una máquina de la nube de GitHub

    # Permisos necesarios para subir al Registry (Opcional A)
    permissions:
      contents: read
      packages: write
    
    # EJERCICIO 3: Sobrescribir la variable a nivel del job
    env:
      NIVEL_VAR: "Sobrescrita dentro del job CI"
    
    steps:
      # Paso obligatorio para que GitHub descargue el código en la máquina
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step de información
      - name: Info
        run: |
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Sistema Operativo: ${{ runner.os }}"
          echo "Nombre del Runner: ${{ runner.name }}"
      
      # EJERCICIOS 3 y 4: Imprimir las variables y los inputs
      - name: Validar Variables y Parámetros
        run: |
          echo "=== EJERCICIO 3: Variables ==="
          echo "Imagen a construir: ${{ env.IMAGE_NAME }}"
          echo "URL de la App: ${{ env.APP_URL }}"
          echo "Nivel de la variable: ${{ env.NIVEL_VAR }}"
          
          echo "=== EJERCICIO 4: Parámetros manuales ==="
          echo "RUN_CD activado?: ${{ inputs.RUN_CD }}"
          echo "Entorno seleccionado: ${{ inputs.DEPLOY_ENV }}"
      
      # EJERCICIO 6: Construir imagen de herramientas CI
      - name: Build CI tools image
        run: |
          echo "Construyendo la imagen Docker de herramientas CI..."
          docker build -t ${{ env.CI_IMAGE_NAME }} -f devops/ci.Dockerfile .

      # OPCIONAL C: Se utiliza la Composite Action del repo IaC para el LINT
      - name: CI - Lint (using Composite Action)
        uses: Sermarmu1999/devops-training-iac-devops/.github/actions/devops-lib@develop
        with:
          image_name: ${{ env.CI_IMAGE_NAME }}
          run_command: "pip install -r requirements.txt flake8 mypy black && make lint"

      # OPCIONAL C: Se utiliza la misma acción para el TEST
      - name: CI - Test (using Composite Action)
        uses: Sermarmu1999/devops-training-iac-devops/.github/actions/devops-lib@develop
        with:
          image_name: ${{ env.CI_IMAGE_NAME }}
          run_command: "pip install -r requirements.txt pytest flake8 mypy && make test"

      # EJERCICIO 7: Construir la imagen Docker de la aplicación
      - name: Build App Image
        run: |
          echo "Construyendo la imagen Docker final de la app Python..."
          docker build -t ${{ env.IMAGE_NAME }} -f devops/Dockerfile .
      
      # OPCIONAL A: Login y Push a GHCR
      - name: Push to GitHub Packages
        # Se quita el IF de las ramas para que se ejecute en la rama actual de trabajo sin tener que mergear a develop
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ${{ env.IMAGE_NAME }} ${{ env.REGISTRY_IMAGE }}
          docker push ${{ env.REGISTRY_IMAGE }}
  
  # EJERCICIOS 8 y 9 (FASE CD)
  cd:
    # El CD necesita que el CI termine primero con éxito
    needs: ci
    runs-on: ubuntu-latest
    # EJERCICIO 8: Condición por rama o parámetro
    if: ${{ inputs.RUN_CD == true || github.ref_name == 'develop' || github.ref_name == 'master' }}
    # Se asocia el entorno de GitHub que se ha creado antes en la web (Ejercicio 5)
    environment: ${{ github.ref_name == 'master' && 'PRO' || 'DEV' }}
    
    steps:
      # Se necesita volver a descargar el código en esta nueva máquina para tener el docker-compose.yml
      - name: Checkout repository
        uses: actions/checkout@v4

      # Se construye la imagen con el nombre exacto que el compose tiene escrito
      - name: Re-build App Image para el CD (Con el nombre del Compose)
        run: |
          echo "Construyendo imagen con el tag que espera el docker-compose.yml..."
          docker build -t contrerasadr/devops-training-python-app:0.0.1 -f devops/Dockerfile .

      # EJERCICIO 9: Simulación de despliegue con Compose
      - name: Deploy con Docker Compose
        run: |
          echo "Iniciando despliegue local con Docker Compose..."
          # Se usa un nombre de proyecto dinámico (pro o dev)
          export PROJECT_NAME=${{ github.ref_name == 'master' && 'pro' || 'dev' }}
          
          docker compose -p $PROJECT_NAME up -d
          sleep 5
          echo "URL de acceso: ${{ env.APP_URL }}"
          
          echo "--- Logs del contenedor principal ---"
          docker compose -p $PROJECT_NAME logs app

      # EJERCICIO 9: Cleanup garantizado
      - name: Cleanup de recursos
        if: always() # Esto se ejecuta aunque el paso anterior falle
        run: |
          echo "Ejecutando limpieza (down --volumes)..."
          export PROJECT_NAME=${{ github.ref_name == 'master' && 'pro' || 'dev' }}
          docker compose -p $PROJECT_NAME down --volumes || true